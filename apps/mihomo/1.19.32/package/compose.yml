services:
  mihomo:
    image: metacubex/mihomo:v1.19.32
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ./data/mihomo:/root/.config/mihomo
    ports:
      - "${PANEL_APP_PORT}:7890"
      - "${PANEL_API_PORT}:9090"
    networks:
      - 1panel-network

  metacubexd:
    image: ghcr.io/metacubex/metacubexd:v1.273.1
    container_name: ${CONTAINER_NAME}-ui
    restart: unless-stopped
    ports:
      - "${PANEL_UI_PORT}:80"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
