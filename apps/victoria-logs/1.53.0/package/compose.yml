services:
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${RETENTION_PERIOD}
    ports:
      - "${PANEL_APP_PORT}:9428"
    volumes:
      - ./data:/victoria-logs-data
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
