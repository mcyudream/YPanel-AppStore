# Element Skin 入口：SPA 前端 + API 反代
server {
    listen 80;
    root /var/www/element-skin;
    index index.html;

    # Yggdrasil API 透传到 backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理台 API
    location /skinapi/ {
        proxy_pass http://backend:8000/skinapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
