# 可选组件：消息渲染服务（render-server，勾选「可选组件」后由安装器合并进主编排）
services:
  render-server:
    image: ${CI_REGISTRY_IMAGE:-registry.yudream.online/yda}/render-server:${TAG:-latest}
    container_name: ${CONTAINER_NAME}-render
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - RENDER_HOST=0.0.0.0
      - RENDER_PORT=3000
      - RENDER_TOKEN=${MESSAGE_RENDER_TOKEN:-}
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-2}
      - RENDER_TIMEOUT_MS=${RENDER_TIMEOUT_MS:-30000}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
