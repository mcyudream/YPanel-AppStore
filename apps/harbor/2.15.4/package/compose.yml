services:
  # 初始化：从安装参数生成 harbor.yml → 官方 prepare 产出全部组件配置（./common/config）
  # 其余服务依赖本服务成功退出后启动；compose 产物写入丢弃目录（用面板这份编排）
  prepare:
    image: goharbor/prepare:v2.15.4
    container_name: ${CONTAINER_NAME}-prepare
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/harbor.yml <<EOF
        hostname: "${HARBOR_HOSTNAME}"
        external_url: "http://${HARBOR_HOSTNAME}:${PANEL_APP_PORT}"
        http:
          port: 8080
        harbor_admin_password: "${HARBOR_ADMIN_PASSWORD}"
        database:
          password: "${HARBOR_DB_PASSWORD}"
          max_idle_conns: 100
          max_open_conns: 900
        external_redis:
          host: "${HARBOR_REDIS_HOST}:${HARBOR_REDIS_PORT}"
          password: "${HARBOR_REDIS_PASSWORD}"
        data_volume: /data
        trivy:
          ignore_unfixed: false
          skip_update: false
          skip_java_db_update: false
          db_repository: ghcr.io/aquasecurity/trivy-db
          java_db_repository: ghcr.io/aquasecurity/trivy-java-db
          offline_scan: false
          security_check: vuln
          insecure: false
          timeout: 5m0s
        jobservice:
          max_job_workers: 10
          job_loggers:
            - STD_OUTPUT
            - FILE
          logger_sweeper_duration: 1
        notification:
          webhook_job_max_retry: 3
          webhook_job_http_client_timeout: 3
        log:
          level: info
          local:
            rotate_count: 50
            rotate_size: 200M
            location: /var/log/harbor
        proxy:
          http_proxy:
          https_proxy:
          no_proxy:
          components:
            - core
            - jobservice
            - trivy
        network:
          allow_private_network_access: true
        upload_purging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
        _version: 2.15.0
        EOF
        python3 main.py prepare --conf /tmp/harbor.yml --with-trivy
    volumes:
      - ./data/harbor:/data
      - ./common/config:/config
      - ./prepare-out:/compose_location
    networks:
      - 1panel-network
    restart: "no"

  log:
    image: goharbor/harbor-log:v2.15.4
    container_name: ${CONTAINER_NAME}-log
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - /var/log/harbor/:/var/log/docker/:z
      - type: bind
        source: ./common/config/log/logrotate.conf
        target: /etc/logrotate.d/logrotate.conf
      - type: bind
        source: ./common/config/log/rsyslog_docker.conf
        target: /etc/rsyslog.d/rsyslog_docker.conf
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "harbor-log"

  registry:
    image: goharbor/registry-photon:v2.15.4
    container_name: ${CONTAINER_NAME}-registry
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/harbor/registry:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./data/harbor/secret/registry/root.crt
        target: /etc/registry/root.crt
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "registry"

  registryctl:
    image: goharbor/harbor-registryctl:v2.15.4
    container_name: ${CONTAINER_NAME}-registryctl
    env_file:
      - ./common/config/registryctl/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/harbor/registry:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - type: bind
        source: ./common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "registryctl"

  postgresql:
    image: goharbor/harbor-db:v2.15.4
    container_name: ${CONTAINER_NAME}-db
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ./data/harbor/database:/var/lib/postgresql/data:z
    env_file:
      - ./common/config/db/env
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
    shm_size: "1gb"
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "postgresql"

  trivy-adapter:
    container_name: ${CONTAINER_NAME}-trivy
    image: goharbor/trivy-adapter-photon:v2.15.4
    restart: unless-stopped
    cap_drop:
      - ALL
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
    networks:
      - 1panel-network
    volumes:
      - type: bind
        source: ./data/harbor/trivy-adapter/trivy
        target: /home/scanner/.cache/trivy
      - type: bind
        source: ./data/harbor/trivy-adapter/reports
        target: /home/scanner/.cache/reports
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "trivy-adapter"
    env_file:
      - ./common/config/trivy-adapter/env

  core:
    image: goharbor/harbor-core:v2.15.4
    container_name: ${CONTAINER_NAME}-core
    env_file:
      - ./common/config/core/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - ./data/harbor/ca_download/:/etc/core/ca/:z
      - ./data/harbor/:/data/:z
      - ./common/config/core/certificates/:/etc/core/certificates/:z
      - type: bind
        source: ./common/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./data/harbor/secret/core/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./data/harbor/secret/keys/secretkey
        target: /etc/core/key
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
      registry:
        condition: service_started
      postgresql:
        condition: service_started

    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "core"

  portal:
    image: goharbor/harbor-portal:v2.15.4
    container_name: ${CONTAINER_NAME}-portal
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "portal"

  jobservice:
    image: goharbor/harbor-jobservice:v2.15.4
    container_name: ${CONTAINER_NAME}-jobservice
    env_file:
      - ./common/config/jobservice/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./data/harbor/job_logs:/var/log/jobs:z
      - type: bind
        source: ./common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - 1panel-network
    depends_on:
      prepare:
        condition: service_completed_successfully
      core:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "jobservice"

  proxy:
    image: goharbor/nginx-photon:v2.15.4
    container_name: ${CONTAINER_NAME}-nginx
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./common/config/nginx:/etc/nginx:z
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT}:8080"
    depends_on:
      prepare:
        condition: service_completed_successfully
      log:
        condition: service_started
      registry:
        condition: service_started
      core:
        condition: service_started
      portal:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://log:10514"
        tag: "proxy"

networks:
  1panel-network:
    external: true
